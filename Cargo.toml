[workspace]
members = ["xtask"]

[package]
name = "hardwave-wideboi"
version = "0.2.0"
edition = "2021"
license = "Proprietary"
description = "Hardwave WideBoi — stereo widener VST3/CLAP plugin by Hardwave Studios"

[lib]
crate-type = ["cdylib"]

[dependencies]
dirs = "5"
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["tls"] }
nih_plug = { git = "https://github.com/Dishairano/nih-plug-hardwave.git", branch = "main" }

[profile.release]
lto = "thin"
